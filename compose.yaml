services:
  fraud:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - fraud-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health'))['model_ready']"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  fraud-data:
